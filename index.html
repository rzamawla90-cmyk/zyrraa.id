  z-index:0;

.logo img{

.hero p{
  margin-top:10px;

/* BUTTON */
.cta{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:24px;
  padding:14px 28px;
  border-radius:999px;
  background:linear-gradient(90deg,#ff9ecb,#b388ff);
  color:#fff;
  text-decoration:none;
  font-weight:600;
  transition:.3s ease;
  box-shadow:0 10px 25px rgba(179,136,255,0.35);
}

.cta:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 15px 35px rgba(179,136,255,0.55);
}

/* GRID */
.grid{
  margin-top:55px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

/* CARD */
.card{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-radius:24px;
  padding:28px 22px;
  text-decoration:none;
  color:#fff;
  transition:.35s ease;
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0)
  );
  pointer-events:none;
}

.card:hover{
  transform:translateY(-6px);
  background:rgba(255,255,255,0.18);
  border-color:rgba(255,255,255,0.3);
}

.card i{
  font-size:30px;
  margin-bottom:16px;
  background:linear-gradient(90deg,#ffd3e6,#ffffff,#d7c0ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.card h3{
  font-size:17px;
  font-weight:600;
  text-transform:capitalize;
  margin-bottom:6px;
}

.card p{
  font-size:13px;
  color:rgba(255,255,255,0.72);
}

/* FLOATING */
.heart,
.sparkle{
  position:fixed;
  pointer-events:none;
  z-index:1;
}

.heart{
  font-size:16px;
  animation:floatUp linear infinite;
}

.sparkle{
  width:4px;
  height:4px;
  background:#fff;
  border-radius:50%;
  opacity:.8;
  animation:floatUp linear infinite;
}

/* ANIMATION */
@keyframes floatUp{
  from{
    transform:translateY(100vh);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  to{
    transform:translateY(-120px);
    opacity:0;
  }
}

/* FOOTER */
footer{
  position:relative;
  z-index:2;
  text-align:center;
  padding:25px 20px 35px;
  color:rgba(255,255,255,0.75);

}

/* RESPONSIVE */

@media(max-width:600px){
